services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ganapathy
      POSTGRES_PASSWORD: change_this
      POSTGRES_DB: ganapathy_pos
    ports:
      - "55433:5432"
    volumes:
      - ganapathy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganapathy -d ganapathy_pos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ganapathy_pg:


