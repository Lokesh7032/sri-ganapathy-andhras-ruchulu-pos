[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ============================================================
# API -> SERVERLESS FUNCTION
# ============================================================

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Health MUST reach Express function
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

# ============================================================
# ROOT / POS
#
# IMPORTANT:
# DO NOT use 301/302 here.
# Direct rewrites prevent redirect loops.
# ============================================================

[[redirects]]
  from = "/"
  to = "/pos/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/pos"
  to = "/pos/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/pos/"
  to = "/pos/index.html"
  status = 200
  force = true

# ============================================================
# ADMIN
# ============================================================

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = true

# ============================================================
# KDS
# ============================================================

[[redirects]]
  from = "/kds"
  to = "/kds/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/kds/"
