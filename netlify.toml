[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/pos/"
  status = 302

[[redirects]]
  from = "/pos"
  to = "/pos/"
  status = 301

[[redirects]]
  from = "/b/*/pos"
  to = "/pos/"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/kds/*"
  to = "/kds/index.html"
  status = 200

[[redirects]]
  from = "/order/*"
  to = "/customer/index.html"
  status = 200
