<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>Sri Ganapathy Andhra's Ruchulu</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f6f7f9;
  color:#111827;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.login-shell{
  width:100%;
  max-width:430px;
}

.login-card{
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:22px;
  padding:34px;
  box-shadow:0 18px 50px rgba(15,23,42,.10);
}

.brand{
  display:flex;
  justify-content:center;
  margin-bottom:24px;
}

.brand img{
  display:block;
  width:108px;
  height:108px;
  object-fit:contain;
  border-radius:18px;
}

.title{
  margin:0;
  text-align:center;
  font-size:25px;
  line-height:1.25;
  font-weight:750;
  letter-spacing:-.02em;
}

.subtitle{
  margin:8px 0 28px;
  text-align:center;
  color:#6b7280;
  font-size:14px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:650;
  color:#374151;
}

.field input{
  width:100%;
  height:48px;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:0 14px;
  outline:none;
  font-size:16px;
  color:#111827;
  background:#fff;
}

.field input:focus{
  border-color:#111827;
  box-shadow:0 0 0 3px rgba(17,24,39,.08);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:76px;
}

.show-password{
  position:absolute;
  right:9px;
  top:7px;
  height:34px;
  border:0;
  background:transparent;
  padding:0 9px;
  border-radius:8px;
  color:#4b5563;
  font-weight:650;
  cursor:pointer;
}

.show-password:hover{
  background:#f3f4f6;
}

.sign-in{
  width:100%;
  height:50px;
  border:0;
  border-radius:12px;
  background:#111827;
  color:#fff;
  font-size:15px;
  font-weight:750;
  cursor:pointer;
  margin-top:5px;
}

.sign-in:hover{
  background:#1f2937;
}

.sign-in:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.error{
  display:none;
  margin:0 0 15px;
  padding:11px 12px;
  border-radius:10px;
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#b91c1c;
  font-size:13px;
  line-height:1.4;
}

.loading{
  display:none;
  text-align:center;
  margin-top:13px;
  color:#6b7280;
  font-size:13px;
}

@media(max-width:520px){
  body{
    padding:14px;
  }

  .login-card{
    padding:25px 20px;
    border-radius:18px;
  }

  .brand img{
    width:92px;
    height:92px;
  }

  .title{
    font-size:22px;
  }
}
</style>
</head>

<body>

<main class="login-shell">

  <section class="login-card">

    <div class="brand">
      <img
        src="/brand/logo-primary.jpg?v=final-1"
        alt="Sri Ganapathy Andhra's Ruchulu"
      >
    </div>

    <h1 class="title">Sri Ganapathy Andhra's Ruchulu</h1>

    <p class="subtitle">POS Login</p>

    <form id="loginForm" autocomplete="on">

      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <div class="password-wrap">

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            id="showPassword"
            class="show-password"
          >Show</button>

        </div>
      </div>

      <div id="error" class="error"></div>

      <button
        id="signIn"
        class="sign-in"
        type="submit"
      >
        SIGN IN
      </button>

      <div id="loading" class="loading">
        Signing in...
      </div>

    </form>

  </section>

</main>

<script>
(function(){

  const form = document.getElementById("loginForm");
  const username = document.getElementById("username");
  const password = document.getElementById("password");
  const button = document.getElementById("signIn");
  const show = document.getElementById("showPassword");
  const error = document.getElementById("error");
  const loading = document.getElementById("loading");

  function showError(message){
    error.textContent = message || "Login failed. Please try again.";
    error.style.display = "block";
  }

  function clearError(){
    error.textContent = "";
    error.style.display = "none";
  }

  show.addEventListener("click", function(){
    if(password.type === "password"){
      password.type = "text";
      show.textContent = "Hide";
    }else{
      password.type = "password";
      show.textContent = "Show";
    }
  });

  form.addEventListener("submit", async function(event){

    event.preventDefault();
    clearError();

    const user = username.value.trim();
    const pass = password.value;

    if(!user || !pass){
      showError("Username and password are required.");
      return;
    }

    button.disabled = true;
    loading.style.display = "block";

    try{

      const response = await fetch("/api/auth/login", {
        method:"POST",
        credentials:"include",
        headers:{
          "Content-Type":"application/json",
          "Accept":"application/json"
        },
        cache:"no-store",
        body:JSON.stringify({
          username:user,
          password:pass
        })
      });

      let data = {};

      try{
        data = await response.json();
      }catch(_){}

      if(!response.ok){

        if(response.status === 401){
          throw new Error("Invalid username or password.");
        }

        if(response.status === 429){
          throw new Error("Too many login attempts. Please wait a few minutes.");
        }

        if(response.status === 502){
          throw new Error("Production database service is unavailable. Please try again shortly.");
        }

        throw new Error(
          data.error ||
          "Login service is unavailable."
        );
      }

      if(!data.ok){
        throw new Error(data.error || "Login failed.");
      }

      const meResponse = await fetch("/api/me", {
        method:"GET",
        credentials:"include",
        cache:"no-store",
        headers:{
          "Accept":"application/json"
        }
      });

      if(!meResponse.ok){
        throw new Error("Session could not be established.");
      }

      window.location.replace("/pos/?v=" + Date.now());

    }catch(err){

      showError(
        err && err.message
          ? err.message
          : "Login failed."
      );

      button.disabled = false;
      loading.style.display = "none";
    }

  });

})();
</script>

</body>
</html>
