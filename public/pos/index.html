<!doctype html>
<html lang="en">
<head>
    <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<meta name="format-detection" content="telephone=no">

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">

<meta
  name="theme-color"
  content="#24150f"
>

<meta
  name="robots"
  content="noindex,nofollow"
>



<title>Sri Ganapathy Andhra's Ruchulu · POS</title>

<link
  rel="stylesheet"
  href="/pos/style.css?v=8"
>

</head>

<body>

<!-- =========================================================
     SGAR REAL SPLASH
     ACTUAL PROVIDED 6-FRAME BRAND ANIMATION
     ========================================================= -->

<div
  id="splash"
  class="splashScreen"
>

  <div class="splashAnimationFrame">

    <div
      class="splashAnim"
      aria-label="Sri Ganapathy Andhra's Ruchulu loading animation"
    ></div>

  </div>

  <div class="splashBrandTitle">
    SRI GANAPATHY
  </div>

  <div class="splashBrandSub">
    ANDHRA'S RUCHULU
  </div>

  <div class="splashLoading">

    <span></span>

  </div>

  <div class="splashLoadingText">
    Loading Fresh Flavours...
  </div>

</div>


<div id="app"></div>


<script
  src="/socket.io/socket.io.js"
></script>

<script
  src="/pos/app.js?v=8"
  defer
></script>

<script src="/pos/sgar-final-production.js"></script>
<script src="/pos/sgar-single-pos-final.js" defer></script>

<!-- SGAR 2 SECOND SPLASH -->
<div id="sgar-splash-screen" aria-label="Sri Ganapathy Andhra's Ruchulu">
    <div class="sgar-splash-inner">
        <img src="/pos/favicon.ico"
             alt="Sri Ganapathy Andhra's Ruchulu"
             class="sgar-splash-logo"
             onerror="this.style.display='none'">
        <div class="sgar-splash-brand">SRI GANAPATHY</div>
        <div class="sgar-splash-sub">ANDHRA'S RUCHULU</div>
    </div>
</div>

<style>
#sgar-splash-screen {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    opacity: 1;
    visibility: visible;
    transition: opacity .22s ease, visibility .22s ease;
}

#sgar-splash-screen.sgar-splash-hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.sgar-splash-inner {
    width: min(90vw, 420px);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.sgar-splash-logo {
    width: min(150px, 42vw);
    height: min(150px, 42vw);
    object-fit: contain;
    margin-bottom: 18px;
}

.sgar-splash-brand {
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 800;
    letter-spacing: .08em;
}

.sgar-splash-sub {
    margin-top: 6px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(11px, 2.8vw, 15px);
    letter-spacing: .18em;
    opacity: .68;
}

@media (prefers-reduced-motion: reduce) {
    #sgar-splash-screen {
        transition: none;
    }
}
</style>

<script>
(function () {
    var splash = document.getElementById("sgar-splash-screen");

    if (!splash) return;

    window.setTimeout(function () {
        splash.classList.add("sgar-splash-hide");

        window.setTimeout(function () {
            if (splash && splash.parentNode) {
                splash.parentNode.removeChild(splash);
            }
        }, 260);
    }, 2000);
})();
</script>

</body>
</html>
